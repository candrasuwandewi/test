<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Identitas Mahasiswa</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 0;
        padding: 40px;
      }

      .container {
        width: 500px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      textarea {
        height: 80px;
        resize: none;
      }

      .gender {
        display: flex;
        gap: 20px;
      }

      .gender label {
        font-weight: normal;
        margin-top: 5px;
      }

      .gender input {
        width: auto;
      }

      button {
        width: 100%;
        padding: 12px;
        margin-top: 25px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Form Identitas Mahasiswa</h2>

      <form>
        <label for="nim">NIM</label>
        <input type="text" id="nim" name="nim" placeholder="Masukkan NIM" />

        <label for="nama">Nama Lengkap</label>
        <input
          type="text"
          id="nama"
          name="nama"
          placeholder="Masukkan nama lengkap"
        />

        <label for="tempat">Tempat Lahir</label>
        <input
          type="text"
          id="tempat"
          name="tempat"
          placeholder="Masukkan tempat lahir"
        />

        <label for="tanggal">Tanggal Lahir</label>
        <input type="date" id="tanggal" name="tanggal" />

        <label>Jenis Kelamin</label>
        <div class="gender">
          <label>
            <input type="radio" name="gender" value="Laki-laki" />
            Laki-laki
          </label>

          <label>
            <input type="radio" name="gender" value="Perempuan" />
            Perempuan
          </label>
        </div>

        <label for="fakultas">Fakultas</label>
        <select id="fakultas" name="fakultas">
          <option value="">-- Pilih Fakultas --</option>
          <option value="FIK">Fakultas Ilmu Komputer</option>
          <option value="FEB">Fakultas Ekonomi dan Bisnis</option>
          <option value="FISIP">Fakultas Ilmu Sosial dan Politik</option>
          <option value="FT">Fakultas Teknik</option>
        </select>

        <label for="prodi">Program Studi</label>
        <select id="prodi" name="prodi">
          <option value="">-- Pilih Program Studi --</option>
          <option value="Informatika">Informatika</option>
          <option value="Sistem Informasi">Sistem Informasi</option>
          <option value="Bisnis Digital">Bisnis Digital</option>
          <option value="Manajemen">Manajemen</option>
        </select>

        <label for="alamat">Alamat</label>
        <textarea
          id="alamat"
          name="alamat"
          placeholder="Masukkan alamat lengkap"
        ></textarea>

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="contoh@email.com"
        />

        <label for="telepon">No. HP</label>
        <input
          type="tel"
          id="telepon"
          name="telepon"
          placeholder="08xxxxxxxxxx"
        />

        <button type="submit">Simpan Data</button>
      </form>
    </div>
  </body>
</html>
